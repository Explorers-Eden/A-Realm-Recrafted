name: Publish Git Release

on:
  workflow_dispatch:
  # Every push to main rebuilds the "latest" release (the tag this workflow moves doesn't start it again).
  push:
    branches: [main]

# Two quick pushes: the newer run replaces the older one instead of both updating the release at once.
concurrency:
  group: publish-git-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Read release metadata
        id: meta
        run: |
          echo "tag_name=latest" >> "$GITHUB_OUTPUT"
          echo "release_name=A Realm Recrafted" >> "$GITHUB_OUTPUT"
          echo "zip_name=a_realm_recrafted.zip" >> "$GITHUB_OUTPUT"

      - name: Build datapack zip
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          files=(assets data LICENSE pack.mcmeta)
          [ -f pack.png ] && files+=(pack.png)
          zip -r -X "$ZIP_NAME" "${files[@]}" -x '*.DS_Store'

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --latest \
              --title "$RELEASE_NAME" \
              --notes-file changelog.log
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file changelog.log \
              --latest
          fi

          gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber
